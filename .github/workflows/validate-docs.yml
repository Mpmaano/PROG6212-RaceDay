name: Validate Docs Structure

on: [push, pull_request]

jobs:
  check-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required files exist
        run: |
          echo "Checking for required Part 1 files..."
          test -d docs
          test -f docs/ERD-RaceDay.png
          test -f docs/API-Endpoint-Plan.md
          test -f docs/RaceDay-Schema.sql
          echo "All required files are present."